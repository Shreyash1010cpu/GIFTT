<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a8edea);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        h1 {
            font-size: 2.5em;
            color: #d63384;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .cute-text {
            font-size: 1.1em;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-style: italic;
        }

        button {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        #noBtn {
            background: #e9ecef;
            color: #6c757d;
            position: relative;
        }

        #noBtn:hover {
            animation: moveAway 0.5s ease-in-out;
        }

        @keyframes moveAway {
            0% { transform: translateX(0); }
            25% { transform: translateX(100px); }
            50% { transform: translateY(-50px); }
            75% { transform: translateX(-100px); }
            100% { transform: translateY(0); }
        }

        .gifts {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .gift {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
            width: 80%;
            max-width: 300px;
        }

        .gift:hover {
            transform: scale(1.05);
        }

        .gift h3 {
            color: #d63384;
            margin: 0;
        }

        .gift-content {
            display: none;
            margin-top: 10px;
            font-size: 1.2em;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will you be my Valentine?</h1>
        <p>Click Yes to make me the happiest person alive!</p>
        <p class="cute-text">You are my everything, my love, my heart 💕</p>
        <button id="yesBtn">Yes!</button>
        <button id="noBtn">No</button>
    </div>
    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Make "No" button move away on hover
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // "Yes" button action: Show a sweet message and gifts, and enable scrolling
        yesBtn.addEventListener('click', () => {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 50px; font-family: 'Dancing Script', cursive; background: linear-gradient(135deg, #ff9a9e, #fecfef); min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
                    <h1 style="font-size: 3em; color: #d63384;">Yes! I love you Vaishnavii! 💍</h1>
                    <p style="font-size: 1.5em; color: #6c757d;">You've made me the happiest. I'm so lucky to have you in my life!</p>
                    <div class="gifts">
                        <div class="gift" onclick="toggleGift('cute')">
                            <h3>🎁Gift </h3>
                            <div id="cute-content" class="gift-content">You are the best thing that has happened to me! Thank you for coming in my life</div>
                        </div>
                        <div class="gift" onclick="toggleGift('hot')">
                            <h3>🎁Gift </h3>
                            <div id="hot-content" class="gift-content">Your kisses set my soul on fire... can't wait for more!</div>
                        </div>
                        <div class="gift" onclick="toggleGift('future')">
                            <h3>🎁Gift </h3>
                            <div id="future-content" class="gift-content">Together, we'll build a life full of adventures and endless love! 🏡❤️</div>
                        </div>
                    </div>
                </div>
            `;
            // Enable scrolling for the new page (important for mobile)
            document.body.style.overflow = 'auto';
        });

        // Function to toggle gift content visibility
        function toggleGift(type) {
            const content = document.getElementById(type + '-content');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
